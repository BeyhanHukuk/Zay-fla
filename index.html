<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zayıfla</title>
  <meta name="description" content="Sesle kalori takibi, kilo trendi ve hatırlatıcılar. Çevrimdışı çalışır.">
  <meta name="theme-color" content="#f4f6f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1210" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zayıfla">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <main id="view" class="view" tabindex="-1"></main>

    <form id="quickbar" class="quickbar" autocomplete="off" hidden>
      <button type="button" class="qb-search" data-action="search" aria-label="Besin ara"></button>
      <input id="qb-input" class="qb-input" type="text" enterkeyhint="send" inputmode="text"
             placeholder="Ne yedin? örn: 2 dilim ekmek ve 1 bardak çay" aria-label="Ne yedin?">
      <button type="button" class="qb-mic" data-action="voice" aria-label="Sesle ekle"></button>
      <button type="submit" class="qb-send" aria-label="Gönder" hidden></button>
    </form>

    <nav id="tabbar" class="tabbar" aria-label="Ana menü" hidden>
      <a href="#bugun" data-tab="bugun" class="tab"><span class="tab-ic" data-icon="home"></span><span>Bugün</span></a>
      <a href="#ilerleme" data-tab="ilerleme" class="tab"><span class="tab-ic" data-icon="chart"></span><span>İlerleme</span></a>
      <button type="button" class="tab-fab" data-action="addhub" aria-label="Ekle"><span data-icon="plus"></span></button>
      <a href="#kilo" data-tab="kilo" class="tab"><span class="tab-ic" data-icon="scale"></span><span>Kilo</span></a>
      <a href="#ayarlar" data-tab="ayarlar" class="tab"><span class="tab-ic" data-icon="settings"></span><span>Ayarlar</span></a>
    </nav>
  </div>

  <div id="sheets" class="sheets" aria-live="polite"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript><p style="padding:24px;font-family:sans-serif">Zayıfla'yı kullanmak için JavaScript'i etkinleştirin.</p></noscript>

  <script src="foods.js"></script>
  <script src="parser.js"></script>
  <script src="charts.js"></script>
  <script src="notify.js"></script>
  <script src="app.js"></script>
</body>
</html>
